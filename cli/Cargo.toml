[package]
name = "daimon-tui-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Standalone interactive and headless CLI for daimon-tui"

[[bin]]
name = "daimon-tui"
path = "src/main.rs"
doc = false

[dependencies]
daimon-tui = { path = ".." }
daimon-client = { version = "=0.1.0", path = "../../daimon/crates/daimon-client", features = ["unix"] }
daimon-agent-command = { version = "=0.1.0", path = "../../daimon/crates/daimon-agent-command" }
daimon-protocol = { version = "=0.1.0", path = "../../daimon/crates/daimon-protocol" }
daimon-wire = { version = "=0.1.0", path = "../../daimon/crates/daimon-wire" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde_json = "=1.0.151"

[dev-dependencies]
daimon-harness = { version = "=0.0.1", path = "../../daimon" }
daimon-host = { version = "=0.1.0", path = "../../daimon/crates/daimon-host" }
daimon-service = { version = "=0.1.0", path = "../../daimon/crates/daimon-service" }
daimon-local-daemon = { version = "=0.1.0", path = "../../daimon/crates/daimon-local-daemon" }
daimon-local = { version = "=0.1.0", path = "../../daimon/adapters/daimon-local" }
daimon-checkpoint = { version = "=0.1.0", path = "../../daimon/adapters/daimon-checkpoint" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
